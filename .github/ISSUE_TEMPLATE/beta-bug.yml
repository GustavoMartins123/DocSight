name: Beta observation
description: Report a reproducible DocSight beta issue without private document content.
title: "[beta] "
body:
  - type: markdown
    attributes:
      value: "Do not attach private documents, passwords, raw logs or personal identifiers. Follow BETA.md and obtain consent before sharing a minimized reproducer."
  - type: input
    id: candidate
    attributes:
      label: Candidate version, full revision and archive SHA-256
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Intended task and sanitized reproduction steps
      description: Include the operation and public diagnostic codes, not document paths or text.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Maintainer regression evidence
      description: Before-fix failing case, input hashes, after-fix passing case and test command. Do not mark resolved without a regression.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed private content and credentials from this report and have permission to share any included reproducer.
          required: true
