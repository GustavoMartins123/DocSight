name: conformance

on:
  push:
  pull_request:

jobs:
  evidence-engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - run: cargo test -p docsight-search
      - run: cargo test -p docsight-cli --test m15_conformance_cli --test m16_interaction_cli
