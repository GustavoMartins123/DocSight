[workspace]
members = [
    "crates/docsight-agent",
    "crates/docsight-cli",
    "crates/docsight-core",
    "crates/docsight-layout",
    "crates/docsight-ooxml",
    "crates/docsight-pdf",
    "crates/docsight-render",
    "crates/docsight-search",
    "crates/docsight-tables",
    "crates/docsight-diff",
    "crates/docsight-worker",
]
resolver = "3"

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
flate2 = { version = "1.1.4", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
windows-sys = "0.61.2"
roxmltree = "0.21.1"
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
