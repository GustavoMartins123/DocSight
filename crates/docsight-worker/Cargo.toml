[package]
name = "docsight-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "docsight_worker"
path = "src/lib.rs"

[[bin]]
name = "docsight-worker"
path = "src/main.rs"

[dependencies]
clap.workspace = true
docsight-core = { path = "../docsight-core" }
docsight-layout = { path = "../docsight-layout" }
docsight-ooxml = { path = "../docsight-ooxml" }
docsight-pdf = { path = "../docsight-pdf" }
docsight-render = { path = "../docsight-render" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
